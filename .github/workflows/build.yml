name: Build and test

on:
  pull_request:

permissions:
  contents: read

jobs:
  disputes-service:
    name: Disputes service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: disputes-service/pom.xml
      - name: Test
        working-directory: disputes-service
        run: ./mvnw --batch-mode test

  rewards-service:
    name: Rewards service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: rewards-service
        run: ./gradlew --no-daemon test
